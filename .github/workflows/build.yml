name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p app/src/main/kotlin/com/example/keystrokes
          mkdir -p app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KEYSTROKES"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.keystrokes"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.keystrokes"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="KEYSTROKES"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KeyService"
                      android:exported="false"
                      android:label="KEYSTROKES"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_desc">Показывает нажатия W, A, S, D и пробела с внешней клавиатуры</string>
          </resources>
          EOF

          cat > app/src/main/kotlin/com/example/keystrokes/MainActivity.kt <<'EOF'
          package com.example.keystrokes

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }
                  val info = TextView(this).apply {
                      text = "KEYSTROKES\n\n1. Нажмите кнопку ниже.\n2. Найдите KEYSTROKES в списке и включите.\n3. Подключите клавиатуру и нажимайте W A S D и пробел в любом приложении.\n"
                      textSize = 18f
                  }
                  val btn = Button(this).apply {
                      text = "Открыть настройки"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(info)
                  layout.addView(btn)
                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/kotlin/com/example/keystrokes/KeyService.kt <<'EOF'
          package com.example.keystrokes

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView

          class KeyService : AccessibilityService() {

              private val wm by lazy { getSystemService(WINDOW_SERVICE) as WindowManager }
              private var root: LinearLayout? = null
              private val labels = mutableMapOf<Int, TextView>()

              private val idleColor = Color.argb(153, 0, 0, 0)
              private val activeColor = Color.argb(255, 46, 125, 50)

              private val keyNames = linkedMapOf(
                  KeyEvent.KEYCODE_W to "W",
                  KeyEvent.KEYCODE_A to "A",
                  KeyEvent.KEYCODE_S to "S",
                  KeyEvent.KEYCODE_D to "D",
                  KeyEvent.KEYCODE_SPACE to "SPACE"
              )

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun box(color: Int) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(8).toFloat()
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (root != null) return
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }
                  for ((code, name) in keyNames) {
                      val tv = TextView(this).apply {
                          text = name
                          setTextColor(Color.WHITE)
                          textSize = 16f
                          gravity = Gravity.CENTER
                          background = box(idleColor)
                      }
                      val w = if (code == KeyEvent.KEYCODE_SPACE) dp(80) else dp(44)
                      val lp = LinearLayout.LayoutParams(w, dp(44))
                      lp.setMargins(dp(3), 0, dp(3), 0)
                      row.addView(tv, lp)
                      labels[code] = tv
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.BOTTOM or Gravity.START
                  params.x = dp(16)
                  params.y = dp(16)
                  wm.addView(row, params)
                  root = row
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val tv = labels[event.keyCode] ?: return false
                  when (event.action) {
                      KeyEvent.ACTION_DOWN -> tv.background = box(activeColor)
                      KeyEvent.ACTION_UP -> tv.background = box(idleColor)
                  }
                  return false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: android.content.Intent?): Boolean {
                  root?.let { wm.removeView(it) }
                  root = null
                  labels.clear()
                  return super.onUnbind(intent)
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KEYSTROKES-apk
          path: app/build/outputs/apk/debug/app-debug.apk
